name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm run lint
      - run: npm run test:extension
      - run: npm run test:scripts
      - run: npm run typecheck

  sync-is-fixpoint:
    # The committed skill tree must be exactly what the two reground hops produce
    # from the pinned upstream commits. Catches hand edits under skills/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run sync:upstream
      - run: git diff --exit-code -- skills agents upstream.lock.json
